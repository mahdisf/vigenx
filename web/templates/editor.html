{% extends "base.html" %}
{% block title %}{{ app_name }} · Pipeline Editor{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://esm.sh/reactflow@11.11.4/dist/style.css">
<style>
  #wrapper > .flex-grow-1 { padding: 0 !important; }
  .vx-editor { display: grid; grid-template-columns: 220px 1fr 320px; grid-template-rows: 92px 1fr;
               height: calc(100vh - 0px); }
  .vx-toolbar { grid-column: 1 / 4; display: grid; grid-template-rows: 46px 46px;
                padding: 0 .75rem; background: #1f2330; color: #fff; min-width: 0; }
  .vx-agent-bar, .vx-toolbar-main { display: flex; align-items: center; gap: .5rem; min-width: 0; }
  .vx-agent-bar { border-bottom: 1px solid #343b4f; }
  .vx-agent-bar label { color: #cdd3e0; font-size: .78rem; font-weight: 600; white-space: nowrap; }
  .vx-agent-bar input { flex: 1; min-width: 180px; }
  .vx-toolbar-main { overflow-x: auto; }
  .vx-toolbar-main > * { flex: 0 0 auto; }
  .vx-toolbar-main > .vx-muted { flex: 1 1 240px; white-space: nowrap; overflow: hidden;
                                text-overflow: ellipsis; }
  .vx-toolbar input, .vx-toolbar select { height: 32px; }
  .vx-editor.vx-collapsed { grid-template-columns: 0 1fr 320px; }
  .vx-editor.vx-collapsed .vx-palette { padding: 0; overflow: hidden; }
  .vx-palette { background: #14161d; color: #cdd3e0; overflow-y: auto; padding: .5rem; }
  .vx-palette h6 { color: #7f8aa3; text-transform: uppercase; font-size: .7rem; margin: .75rem .25rem .25rem; }
  .vx-pitem { background: #232838; border: 1px solid #333b52; border-radius: 6px; padding: .35rem .5rem;
              margin-bottom: .35rem; cursor: grab; font-size: .82rem; }
  .vx-pitem:hover { border-color: #5b8cff; }
  .vx-canvas { position: relative; background: #0e1016; }
  .vx-inspector { background: #14161d; color: #cdd3e0; overflow-y: auto; padding: .75rem; }
  .vx-inspector label { font-size: .75rem; color: #9aa4bd; display: block; margin: .5rem 0 .15rem; }
  .vx-inspector input, .vx-inspector select, .vx-inspector textarea {
      width: 100%; background: #232838; color: #fff; border: 1px solid #333b52; border-radius: 5px;
      padding: .25rem .4rem; font-size: .82rem; }
  .vx-preview img, .vx-preview video { width: 100%; border-radius: 6px; background: #000; }
  .vx-btn:disabled { opacity: .4; cursor: not-allowed; }
  .vx-node { background: #232838; border: 1px solid #3a425c; border-radius: 8px;
             min-width: 150px; color: #e7ebf5; font-size: .78rem; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .vx-node.sel { border-color: #5b8cff; }
  .vx-node.st-running { border-color: #f0b429; box-shadow: 0 0 0 2px rgba(240,180,41,.35); }
  .vx-node.st-done { border-color: #2bd576; }
  .vx-node.st-error { border-color: #ff5470; box-shadow: 0 0 0 2px rgba(255,84,112,.35); }
  .vx-node-head { height: 30px; line-height: 30px; padding: 0 .6rem; font-weight: 600;
                  border-bottom: 1px solid #3a425c; background: #2b3145; border-radius: 8px 8px 0 0;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vx-node-rows { display: flex; justify-content: space-between; }
  .vx-col { display: flex; flex-direction: column; }
  .vx-prow { height: 26px; line-height: 26px; padding: 0 .7rem; white-space: nowrap; font-size: .76rem; }
  .vx-prow.out { text-align: right; }
  /* Bigger, type-colored, grabbable connection handles */
  .react-flow__handle { width: 12px; height: 12px; border: 2px solid #14161d; }
  .react-flow__handle:hover { width: 15px; height: 15px; }
  .react-flow__handle-connecting { box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  .react-flow__handle-valid { box-shadow: 0 0 0 3px rgba(43,213,118,.55); }
  .vx-legend { display: flex; flex-wrap: wrap; gap: .35rem .6rem; margin-bottom: .6rem; }
  .vx-legend span { display: inline-flex; align-items: center; gap: .25rem; font-size: .68rem; color: #9aa4bd; }
  .vx-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .vx-adv-toggle { cursor: pointer; color: #5b8cff; font-size: .75rem; margin-top: .5rem; }
  .vx-muted { color: #7f8aa3; font-size: .75rem; }
  .vx-btn { background: #5b8cff; color: #fff; border: 0; border-radius: 5px; padding: .3rem .7rem;
            font-size: .82rem; cursor: pointer; }
  .vx-btn.ghost { background: #2b3145; }
  .vx-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
              display: flex; align-items: flex-start; justify-content: center; padding-top: 70px; }
  .vx-modal-box { background: #161922; color: #e7ebf5; border: 1px solid #333b52; border-radius: 10px;
                  width: min(900px, 92vw); max-height: 80vh; overflow: auto; padding: 1rem; }
  .vx-modal-box input[type=text], .vx-modal-box input:not([type]), .vx-modal-box select {
      background: #232838; color: #fff; border: 1px solid #333b52; border-radius: 5px; padding: .25rem .4rem; }
  .vx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
  .vx-card { background: #232838; border: 2px solid #333b52; border-radius: 8px; padding: .4rem;
             cursor: pointer; font-size: .78rem; }
  .vx-card.sel { border-color: #5b8cff; }
  .vx-card img { width: 100%; height: 84px; object-fit: cover; border-radius: 5px; background: #000; }
  .vx-noimg { height: 84px; display: flex; align-items: center; justify-content: center;
              font-size: 1.6rem; background: #000; border-radius: 5px; }
  .vx-card-t { margin-top: .3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vx-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              color: #5c6580; pointer-events: none; font-size: .95rem; }
  .vx-inspector h5 { color: #e7ebf5; }
  /* file/folder browse + color + font widgets */
  .vx-color-row, .vx-browse-row { display: flex; gap: .3rem; align-items: center; }
  .vx-color-row input[type=color] { width: 36px; height: 30px; padding: 0; flex: 0 0 auto;
      background: #232838; border: 1px solid #333b52; border-radius: 5px; }
  .vx-color-row input[type=text] { flex: 1; }
  .vx-browse-row input { flex: 1; }
  .vx-browse-row .vx-btn { flex: 0 0 auto; padding: .25rem .5rem; }
  /* server-side file/folder picker */
  .vx-fs { max-height: 50vh; overflow: auto; border: 1px solid #333b52; border-radius: 6px;
           margin-top: .4rem; }
  .vx-fs-row { padding: .3rem .55rem; cursor: pointer; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; font-size: .85rem; }
  .vx-fs-row:hover { background: #232838; }
  .vx-fs-row.file { color: #cdd3e0; }
  @media (max-width: 820px) {
    .vx-editor { grid-template-columns: 0 minmax(0, 1fr) 0; grid-template-rows: 104px 1fr; }
    .vx-toolbar { grid-template-rows: 58px 46px; padding: 0 .5rem; }
    .vx-agent-bar { flex-wrap: wrap; align-content: center; gap: .3rem; }
    .vx-agent-bar label { display: none; }
    .vx-agent-bar input { flex-basis: calc(100% - 150px); }
    .vx-palette, .vx-inspector { display: none; }
  }
</style>

<div class="vx-editor" id="vx-root"></div>
<script>window.VIGENX_TEMPLATE_ID = "{{ template_id }}";</script>
<script type="module" src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
