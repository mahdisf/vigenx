<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Content Regenerator{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="d-flex" id="wrapper">
  <!-- Sidebar -->
  <nav class="bg-dark text-white sidebar d-flex flex-column p-3" style="min-width:200px;min-height:100vh">
    <a class="navbar-brand text-white fw-bold mb-4" href="{{ url_for('dashboard.index') }}">🎬 CR</a>
    <ul class="nav flex-column gap-1">
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('dashboard.index') }}">📊 Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('jobs.new') }}">➕ New Job</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('review.index') }}">👁 Review Queue</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('settings.index') }}">⚙️ Settings</a></li>
    </ul>
  </nav>
  <!-- Content -->
  <div class="flex-grow-1 p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
